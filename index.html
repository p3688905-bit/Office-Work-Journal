/* ================================================================
   立繪去背引擎（半透明修正版）
   問題根源：舊版的「局部連續性擴散」規則會沿著相近色滲入
   淺色衣物（清潔小弟的白色防護衣、吳企編的淺色襯衫），
   造成大面積被誤判為背景而呈現半透明。
   修正：
   1) 區域擴散只接受「與邊界背景色模型足夠接近」的像素，
      完全移除局部連續性規則 → 不再滲入角色本體。
   2) 羽化僅限 1 像素邊緣帶，且 alpha 下限 130 → 主體恆不透明。
   3) 去除比例異常時自動重試（過少→放寬、過多→收緊）。
   4) 清潔小弟、吳企編改採天藍底新版立繪，對比更明確。
   ================================================================ */
function keyOnce(img,TOL){
 const w=img.naturalWidth,h=img.naturalHeight;
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;
 const cx=cv.getContext('2d',{willReadFrequently:true});
 cx.drawImage(img,0,0);
 let id;try{id=cx.getImageData(0,0,w,h);}catch(e){return null;}
 const p=id.data;
 /* 已是透明圖 → 直接回傳 */
 let trB=0,ttB=0;
 const chk=(x,y)=>{ttB++;if(p[(y*w+x)*4+3]<25)trB++;};
 for(let x=0;x<w;x+=3){chk(x,0);chk(x,h-1);}
 for(let y=0;y<h;y+=3){chk(0,y);chk(w-1,y);}
 if(ttB&&trB/ttB>0.6)return{url:cv.toDataURL(),removed:1};
 /* 邊界色彩聚類 → 背景色模型 */
 const bins={};let bN=0;
 const addB=(x,y)=>{const i=(y*w+x)*4;if(p[i+3]<120)return;bN++;
  const k=(p[i]>>4)+'_'+(p[i+1]>>4)+'_'+(p[i+2]>>4);
  const b=(bins[k]=bins[k]||{s:[0,0,0],n:0});b.s[0]+=p[i];b.s[1]+=p[i+1];b.s[2]+=p[i+2];b.n++;};
 for(let x=0;x<w;x++){addB(x,0);addB(x,1);addB(x,h-1);addB(x,h-2);}
 for(let y=0;y<h;y++){addB(0,y);addB(1,y);addB(w-1,y);addB(w-2,y);}
 const centers=Object.values(bins).filter(b=>b.n>bN*0.02).map(b=>[b.s[0]/b.n,b.s[1]/b.n,b.s[2]/b.n]);
 if(!centers.length)centers.push([255,255,255]);
 const distC=(r,g,b)=>{let m=1e9;for(const c of centers){const d=Math.abs(r-c[0])+Math.abs(g-c[1])+Math.abs(b-c[2]);if(d<m)m=d;}return m;};
 /* 區域擴散：僅接受接近背景模型的像素（無局部連續性規則） */
 const bgMask=new Uint8Array(w*h);
 const qx=new Int32Array(w*h),qy=new Int32Array(w*h);let head=0,tail=0;
 const tryAdd=(x,y)=>{
  if(x<0||y<0||x>=w||y>=h)return;const q=y*w+x;if(bgMask[q])return;
  const i=q*4;
  if(distC(p[i],p[i+1],p[i+2])<TOL){bgMask[q]=1;qx[tail]=x;qy[tail]=y;tail++;}
 };
 for(let x=0;x<w;x++){tryAdd(x,0);tryAdd(x,h-1);}
 for(let y=0;y<h;y++){tryAdd(0,y);tryAdd(w-1,y);}
 while(head<tail){
  const x=qx[head],y=qy[head];head++;
  tryAdd(x+1,y);tryAdd(x-1,y);tryAdd(x,y+1);tryAdd(x,y-1);
 }
 /* 只保留與圖片邊緣連通的背景（填補內部誤判破洞） */
 const keep=new Uint8Array(w*h);
 const qk=new Int32Array(w*h);let kh=0,kt=0;
 const seed=(x,y)=>{const q=y*w+x;if(bgMask[q]&&!keep[q]){keep[q]=1;qk[kt++]=q;}};
 for(let x=0;x<w;x++){seed(x,0);seed(x,h-1);}
 for(let y=0;y<h;y++){seed(0,y);seed(w-1,y);}
 while(kh<kt){
  const q=qk[kh++],x=q%w,y=(q/w)|0;
  if(x>0&&bgMask[q-1]&&!keep[q-1]){keep[q-1]=1;qk[kt++]=q-1;}
  if(x<w-1&&bgMask[q+1]&&!keep[q+1]){keep[q+1]=1;qk[kt++]=q+1;}
  if(y>0&&bgMask[q-w]&&!keep[q-w]){keep[q-w]=1;qk[kt++]=q-w;}
  if(y<h-1&&bgMask[q+w]&&!keep[q+w]){keep[q+w]=1;qk[kt++]=q+w;}
 }
 let removed=0;for(let q=0;q<w*h;q++)if(keep[q])removed++;
 removed/=(w*h);

 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const q=y*w+x;if(keep[q])continue;
  let near=false;
  if(x>0&&keep[q-1])near=true;
  else if(x<w-1&&keep[q+1])near=true;
  else if(y>0&&keep[q-w])near=true;
  else if(y<h-1&&keep[q+w])near=true;
  else if(x>0&&y>0&&keep[q-w-1])near=true;
  else if(x<w-1&&y>0&&keep[q-w+1])near=true;
  else if(x>0&&y<h-1&&keep[q+w-1])near=true;
  else if(x<w-1&&y<h-1&&keep[q+w+1])near=true;
  if(!near)continue;
  const i=q*4,dc=distC(p[i],p[i+1],p[i+2]);
  const a=Math.max(130,Math.min(255,Math.round((dc-TOL)*255/60)+150));
  p[i+3]=Math.min(p[i+3],a);
 }
 for(let q=0;q<w*h;q++)if(keep[q])p[q*4+3]=0;
 cx.putImageData(id,0,0);
 return{url:cv.toDataURL(),removed};
}
function processSprite(img){
 try{
  let r=keyOnce(img,80);
  if(!r)return null;
  if(r.removed<0.02){const r2=keyOnce(img,110);if(r2&&r2.removed>r.removed)r=r2;}
  else if(r.removed>0.7){const r2=keyOnce(img,50);if(r2&&r2.removed>0.02&&r2.removed<r.removed)r=r2;}
  return r.url;
 }catch(e){return null;}
}

let imglyMod=null,imglyFailed=false;

 if(imglyFailed)return null;
 if(imglyMod)return imglyMod;
 try{
  const mod=await Promise.race([
   import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/index.mjs'),
   new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),15000))
  ]);
  imglyMod=mod;return mod;
 }catch(e){imglyFailed=true;return null;}
}
async function aiUpgrade(){
 const mod=await tryImgly();
 if(!mod)return;
 let ok=0;
 for(const k of Object.keys(SPR)){
  try{
   const blob=await mod.removeBackground(SPR[k],{output:{format:'image/png'}});
   const ou=URL.createObjectURL(blob);
   const im=await loadImg(ou);URL.revokeObjectURL(ou);
   const cv=document.createElement('canvas');cv.width=im.naturalWidth;cv.height=im.naturalHeight;
   cv.getContext('2d').drawImage(im,0,0);
   const old=SPRITE_DATA[k];SPRITE_DATA[k]=cv.toDataURL('image/png');
   document.querySelectorAll('#chars img').forEach(el=>{if(el.src===old)el.src=SPRITE_DATA[k];});
   ok++;
  }catch(e){}
 }
 if(ok>0)toast('AI 去背增強完成 ✓');
}

 if(charTimers[g]){clearTimeout(charTimers[g]);delete charTimers[g];}
 Object.keys(charShown).forEach(k=>{if(charShown[k]===g&&k!==id)delete charShown[k];});
 charShown[id]=g;
 let d=charDivs[g];
 if(!d){
  d=document.createElement('div');d.className='char';d.style.left=POS[pos];
  const im=new Image();im.src=src;im.className='cur';im.setAttribute('data-src',src);
  im.style.opacity=0;im.style.transition='opacity .3s ease';
  d.appendChild(im);charsEl.appendChild(d);charDivs[g]=d;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{d.classList.add('in');im.style.opacity=1;}));
  return;
 }
 d.style.left=POS[pos];
 d.classList.remove('out');d.classList.add('in');
 const curImg=d.querySelector('img.cur');
 if(curImg&&curImg.getAttribute('data-src')===src){curImg.style.opacity=1;return;}
 const im=new Image();im.src=src;im.className='cur';im.setAttribute('data-src',src);
 im.style.opacity=0;im.style.transition='opacity .3s ease';
 d.appendChild(im);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  im.style.opacity=1;
  d.querySelectorAll('img').forEach(o=>{
   if(o!==im){o.classList.remove('cur');o.style.opacity=0;setTimeout(()=>o.remove(),320);}
  });
 }));
}
function hideChar(id){
 const g=groupOf(id);
 Object.keys(charShown).forEach(k=>{if(charShown[k]===g)delete charShown[k];});
 const d=charDivs[g];if(!d)return;
 d.classList.remove('in');d.classList.add('out');
 if(charTimers[g])clearTimeout(charTimers[g]);
 charTimers[g]=setTimeout(()=>{d.remove();delete charDivs[g];delete charTimers[g];},380);
}
function clearChars(){clearAllChars();}
function focusChar(id){
 const sg=id?groupOf(id):null;
 Object.keys(charShown).forEach(k=>{const d=charDivs[charShown[k]];if(d)d.classList.toggle('dimmed',!!sg&&charShown[k]!==sg);});
}
function updateHearts(){$('hearts').textContent='士氣 '+'♥'.repeat(Math.max(0,Math.min(9,heart)));}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}
function pushLog(name,x){const d=document.createElement('div');d.className='logrow';d.innerHTML='<b>'+(name||'')+'</b>'+x;$('logList').appendChild(d);}
async function showCard(s){
 $('cardDate').textContent=s.a;$('cardSub').textContent=s.b;
 const c=$('card');c.classList.remove('on');void c.offsetWidth;c.classList.add('on');
 await sleep(2400);c.classList.remove('on');
}
function renderSay(s){
 dialog.classList.add('on');
 const isNarr=s.t==='narr';
 if(isNarr){nameplate.classList.remove('on');textEl.className='narr';focusChar(null);}
 else{const c=CH[s.w];nameplate.textContent=c.name;nameplate.style.background=c.color;nameplate.classList.add('on');textEl.className='';focusChar(s.w);}
 fullText=s.x;textEl.textContent='';typing=true;nextind.classList.remove('on');
 pushLog(isNarr?'':(CH[s.w]?CH[s.w].name:''),s.x);
 let i=0;clearInterval(typeTimer);
 const spd=skipMode?4:26;
 typeTimer=setInterval(()=>{i++;textEl.textContent=fullText.slice(0,i);
  if(i>=fullText.length){clearInterval(typeTimer);typing=false;nextind.classList.add('on');
   if(autoMode)autoTimer=setTimeout(doAdvance,1300);
   if(skipMode)autoTimer=setTimeout(doAdvance,120);}
 },spd);
}
function finishTyping(){clearInterval(typeTimer);typing=false;textEl.textContent=fullText;nextind.classList.add('on');}
function doAdvance(){clearTimeout(autoTimer);
 if(typing){finishTyping();sfx('click');return;}
 if(waiting&&resolveWait){const r=resolveWait;resolveWait=null;waiting=false;sfx('click');r();}
}
function showChoice(s){
 dialog.classList.remove('on');
 const box=$('choiceBox');box.innerHTML='';box.classList.add('on');
 s.opts.forEach((o,i)=>{
  const b=document.createElement('button');b.className='chopt';b.style.animationDelay=(i*.12)+'s';b.textContent=o.txt;
  b.onmouseenter=()=>sfx('sel');
  b.onclick=e=>{e.stopPropagation();sfx('sel');if(o.heart)heart+=o.heart;updateHearts();box.classList.remove('on');
   const r=choiceResolve;choiceResolve=null;waiting=false;r(o);};
  box.appendChild(b);
 });
 waiting=true;
 return new Promise(r=>{choiceResolve=r;});
}
async function run(){
 running=true;waiting=false;
 while(idx<SCRIPT.length){
  const s=SCRIPT[idx];
  switch(s.t){
   case 'bg':
    clearAllChars();
    setBG(s.v,s.dim);await sleep(260);break;
   case 'music':ME.play(s.v);break;
   case 'chap':chapNow=s.v;$('chaplabel').textContent=s.v;break;
   case 'show':showChar(s.id,s.pos);await sleep(60);break;
   case 'hide':hideChar(s.id);await sleep(60);break;
   case 'heart':heart+=s.d;updateHearts();break;
   case 'card':await showCard(s);break;
   case 'goto':idx=LABELS[s.v];continue;
   case 'label':break;
   case 'say':case 'narr':{
    renderSay(s);waiting=true;
    await new Promise(r=>{resolveWait=r;});
    break;}
   case 'choice':{
    const o=await showChoice(s);
    idx=o.goto?LABELS[o.goto]:idx+1;continue;}
   case 'end':idx++;showEnd();return;
  }
  idx++;
 }
}
function showEnd(){
 dialog.classList.remove('on');clearAllChars();
 let tt,ln;
 if(heart>=6){tt='【元氣滿滿的結局】';ln='即使世界空白，也要好好吃一頓飯、好好上班。';}
 else if(heart>=4){tt='【平穩日常的結局】';ln='明天依然會來，就像租金一樣準時。';}
 else{tt='【略帶煩惱的結局】';ln='擔憂還留在五月，但日誌已經合上了。';}
 $('endTitle').textContent=tt;$('endLine').textContent=ln;
 $('endHeart').textContent='白領士氣值：'+'♥'.repeat(Math.max(0,heart))+'（'+heart+'）';
 $('end').classList.add('on');
}
/* ---------------- 存檔 ---------------- */
function saveGame(){
 const data={idx,heart,chap:chapNow,chars:Object.keys(charShown).map(k=>({id:k,pos:Object.keys(POS).find(p=>POS[p]===charDivs[charShown[k]].style.left)}))};
 let curBg=null;Object.keys(BG).forEach(k=>{if(bgEls[bgCur].src===BG[k])curBg=k;});
 data.bg=curBg;data.dim=bgDimNow;
 localStorage.setItem('oldiary_save',JSON.stringify(data));toast('已儲存進度 ♥');
}
function loadGame(fromTitle){
 const raw=localStorage.getItem('oldiary_save');if(!raw){toast('沒有存檔');return;}
 const d=JSON.parse(raw);
 $('title').style.display='none';$('end').classList.remove('on');$('hud').classList.add('on');
 if(d.bg)setBG(d.bg,d.dim);
 clearAllChars();(d.chars||[]).forEach(c=>showChar(c.id,c.pos));
 heart=d.heart||3;updateHearts();chapNow=d.chap||'';$('chaplabel').textContent=chapNow;
 idx=d.idx||0;running=false;run();
 if(fromTitle)toast('已讀取進度');
}
/* ---------------- 輸入 ---------------- */
stage.addEventListener('pointerdown',e=>{
 if(e.target.closest('button')||$('choiceBox').classList.contains('on')||$('logModal').classList.contains('on'))return;
 if($('title').style.display!=='none'&&$('title').offsetParent)return;
 if($('end').classList.contains('on'))return;
 if(!running)return;
 doAdvance();
});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();doAdvance();}});
$('bSkip').onclick=()=>{skipMode=!skipMode;$('bSkip').classList.toggle('act',skipMode);};
$('bAuto').onclick=()=>{autoMode=!autoMode;$('bAuto').classList.toggle('act',autoMode);};
$('bSave').onclick=saveGame;
$('bLoad').onclick=()=>loadGame(false);
$('bMus').onclick=()=>{ME.setMute(!ME.muted);$('bMus').classList.toggle('act',ME.muted);};
$('bLog').onclick=()=>{$('logModal').classList.add('on');$('logList').scrollTop=$('logList').scrollHeight;};
$('logClose').onclick=()=>$('logModal').classList.remove('on');
$('bStart').onclick=()=>{ME.init();ME.play('title');$('title').style.display='none';$('hud').classList.add('on');heart=3;updateHearts();idx=0;run();};
$('bLoad2').onclick=()=>{ME.init();loadGame(true);};
$('bAgain').onclick=()=>{location.reload();};
$('bTitle').onclick=()=>{location.reload();};
/* ---------------- 載入資源 + 去背 ---------------- */
const SPRITE_DATA={};
(async function(){
 const keys=Object.keys(BG).concat(Object.keys(SPR));
 const prog=$('prog');
 const imgs={};
 let done=0;
 await Promise.all(keys.map(k=>loadImg(BG[k]||SPR[k]).then(im=>{imgs[k]=im;done++;
  prog.textContent='資源載入中… '+Math.round(done/keys.length*100)+'%';
  if(k==='title')$('titleArt').src=im.src;
 }).catch(()=>{done++;})));
 const sprKeys=Object.keys(SPR);
 for(let i=0;i<sprKeys.length;i++){
  const k=sprKeys[i];
  prog.textContent='立繪去背處理中… '+(i+1)+' / '+sprKeys.length;
  const im=imgs[k];
  if(im){const r=processSprite(im);SPRITE_DATA[k]=r||im.src;}
  else SPRITE_DATA[k]=SPR[k];
  await sleep(0);
 }
 prog.textContent='載入完成！';
 $('bStart').classList.remove('dis');
 if(localStorage.getItem('oldiary_save')){$('bLoad2').classList.remove('dis');$('loadinfo').textContent='偵測到存檔紀錄';}
 aiUpgrade();
})();
document.addEventListener('pointerdown',()=>{ME.init();if(ME.ctx&&ME.ctx.state==='suspended')ME.ctx.resume();},{once:false});
</script>
</body>
</html>
